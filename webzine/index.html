<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PISONET</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <h1 class="piso">PISO</h1>
        <h1 class="wifi">\\ WiFi //</h1>

        <div class="insert">
            <!-- the front of the machine: the coin falls through .coin-area into .slot -->
            <div class="coin-machine">
                <p class="insert-text">INSERT COIN</p>
                <div class="coin-area"></div>
                <div class="slot"></div>
            </div>

            <!-- the coin starts here; drag it to the slot -->
            <div class="coin-tray">
                <button class="coin" aria-label="one peso coin: drag it into the slot, or press Enter"></button>
            </div>
        </div>

        <p class="status" aria-live="polite"></p>
    </div>

    <a class="corner-link" href="about.html">about the webzine</a>

    <script src="coin.js"></script>
</body>
</html>
